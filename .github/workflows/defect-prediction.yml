
name: Java Defect Prediction

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  defect-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost shap joblib javalang pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Get changed Java files
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );
            const javaFiles = files
              .filter(f => f.status !== 'removed')
              .map(f => f.filename)
              .filter(f => f.endsWith('.java'));
            fs.writeFileSync(
              'changed_java_files.json',
              JSON.stringify(javaFiles)
            );

      - name: Run defect prediction
        if: github.event_name == 'pull_request'
        run: |
          python -c "import json, subprocess, sys; files=json.load(open('changed_java_files.json', encoding='utf-8')); sys.exit(subprocess.call([sys.executable, 'pipeline/run_pr_analysis.py', *files]))"

      - name: Upload prediction reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: defect-prediction-report
          path: reports/pr_analysis/
          if-no-files-found: warn

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/pr_analysis/report.md';
            if (!fs.existsSync(reportPath)) return;

            const body = fs.readFileSync(reportPath, 'utf8');
            const marker = '<!-- java-defect-prediction-report -->';

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              }
            );

            const existing = comments.find(c =>
              c.user?.type === 'Bot' &&
              c.body?.includes(marker)
            );

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            };

            if (existing) {
              await github.rest.issues.updateComment({
                ...params,
                comment_id: existing.id
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                issue_number: context.issue.number
              });
            }
